# Außensensor: nginx-Standardseite als Köder; .php an den PHP-Honeypot, Probes landen im access.log (sensor.py).
# Zertifikat selbstsigniert für die nackte IP (deploy-sensor.sh), Scanner prüfen es nicht.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/sensor.crt;
    ssl_certificate_key /etc/nginx/sensor.key;
    server_tokens off;
    root /var/www/html;
    index index.nginx-debian.html index.html;
    location ~ \.php(?:$|/) {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { try_files $uri $uri/ =404; }
}
