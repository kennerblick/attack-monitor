# Im server{}-Block von 3lis.de (443) per include einbinden, VOR dessen "location ~ \.php$":
# Regex-Locations gelten in Reihenfolge, die erste passende gewinnt.
# Nur die echten Skripte gehen an php-fpm, jede andere .php-Anfrage an den PHP-Honeypot (backend/honeypot_php.py).
# /portsentry/*.php bleibt über die verschachtelte Location im Vhost bei php-fpm.
location = /lernen/index.php {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    include fastcgi_params;
}
location ~ \.php(?:$|/) {
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
