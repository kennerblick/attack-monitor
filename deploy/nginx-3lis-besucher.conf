# Im server{}-Block von 3lis.de (443) per include einbinden.
# Eigenes Log nur für 3lis.de (Besucherstatistik); access.log bleibt für Monitor und fail2ban erhalten.
access_log /var/log/nginx/access.log;
access_log /var/log/nginx/3lis.access.log;

# Besucherstatistik nur intern: Seite und API hinter Authelia (Regel für Domain 3lis.de nötig)
include /etc/nginx/snippets/authelia-location.conf;
location ^~ /besucher/ {
    include /etc/nginx/snippets/authelia-authrequest.conf;
    try_files $uri $uri/ =404;
}
location = /api/visits {
    include /etc/nginx/snippets/authelia-authrequest.conf;
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
}

# Skripte und Styles nach jedem Deploy frisch: ohne Cache-Control nahmen Browser alte ES-Module zur neuen
# index.html (neue Panels blieben auf „Lade …“). no-cache = Rückfrage per ETag, unverändert kommt 304.
# add_header in einer location ersetzt die geerbten Header, deshalb hier wiederholt (options-ssl-nginx.conf).
location ~* \.(?:js|mjs|css)$ {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
}
